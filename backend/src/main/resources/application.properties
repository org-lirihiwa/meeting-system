# DATABASE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meetings}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RABBITMQ
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:app}
spring.rabbitmq.password=${RABBIT_PASS:change_me}

# MINIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:app}
minio.secret-key=${MINIO_SECRET_KEY:change_me}
minio.bucket=${MINIO_BUCKET:meeting-files}

# SPRING
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# SST
stt.service-url=${STT_SERVICE_URL:http://localhost:8000}

# LLM
llm.ollama.url=${OLLAMA_URL:http://localhost:11434}
llm.ollama.model=${OLLAMA_MODEL:qwen2.5:7b}
