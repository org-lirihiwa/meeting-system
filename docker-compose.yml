services:
  db:
    image: postgres:17
    container_name: meeting-db
    environment:
      POSTGRES_DB: meetings
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - meeting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d meetings"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  meeting_postgres_data:
