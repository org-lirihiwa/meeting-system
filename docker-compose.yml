services:
  db:
    image: postgres:17
    container_name: meeting-db
    environment:
      POSTGRES_DB: meetings
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - meeting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d meetings" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: meeting-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: change_me
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: meeting-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - meeting_minio_data:/data
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: meeting-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: change_me
      MINIO_BUCKET: meeting-files
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    entrypoint: [ "/bin/sh", "/init.sh" ]
    restart: "no"

  stt-service:
    build: ./stt-service
    container_name: meeting-stt
    environment:
      HF_TOKEN: ${HF_TOKEN}
      WHISPER_MODEL: small
    ports:
      - "8000:8000"
    volumes:
      - meeting_stt_cache:/root/.cache
    restart: unless-stopped

volumes:
  meeting_postgres_data:
  meeting_minio_data:
  meeting_stt_cache:
